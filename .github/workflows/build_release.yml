name: "Build & Release"

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  build:
    # ✅ Run only when PR is merged from develop → main
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'develop'

    name: Build & Release
    runs-on: macos-latest

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Setup Java (required for Flutter Android build)
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      # Get Flutter dependencies
      - name: Get dependencies
        run: flutter pub get

      # Build Android APK (release per ABI)
      - name: Build Android APK
        run: flutter build apk --release --split-per-abi

      # Build iOS (without code signing)
      - name: Build iOS IPA
        run: |
          flutter build ios --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          ln -s ../Runner.app Payload/Runner.app
          zip -r app.ipa Payload

      # Upload release assets to GitHub
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/*,build/ios/iphoneos/app.ipa"
          tag: v1.0.${{ github.run_number }}
          token: ${{ secrets.TOKEN }}
          generateReleaseNotes: true
          name: "Release v1.0.${{ github.run_number }}"
